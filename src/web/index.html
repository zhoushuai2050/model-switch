<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model Switch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M7 8.5h10M7 12h6M5 5h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <div>
            <strong>Model Switch</strong>
            <span>本机 Agent 切换台</span>
          </div>
        </div>
        <nav class="switcher" id="app-switcher"></nav>
        <div class="title-actions">
          <button class="btn" id="btn-init" type="button">导入配置</button>
          <button class="btn" data-view="profiles" type="button">Profiles</button>
          <button class="btn" data-view="mcp" type="button">MCP</button>
          <button class="btn primary" id="btn-add" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            添加供应商
          </button>
        </div>
      </header>

      <main class="main">
        <div class="toolbar">
          <div class="status-chip" id="status-chip">加载中…</div>
          <label class="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="搜索供应商 / 模型" autocomplete="off" />
          </label>
        </div>
        <section class="view" id="view-providers"></section>
        <section class="view hidden" id="view-profiles"></section>
        <section class="view hidden" id="view-mcp"></section>
      </main>
    </div>

    <div class="modal hidden" id="modal"></div>
    <div class="toast hidden" id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
