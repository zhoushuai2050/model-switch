<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model Switch</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path fill="currentColor" fill-rule="evenodd" d="M2.4 3.2h19.2A2 2 0 0 1 23.6 5.2v5a2 2 0 0 1-2 2H2.4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2Zm2.3 2.2h3.6a.8.8 0 0 1 .8.8v1.8a.8.8 0 0 1-.8.8H4.7a.8.8 0 0 1-.8-.8V6.2a.8.8 0 0 1 .8-.8Z"/>
              <rect x="0.4" y="14.2" width="23.2" height="6.6" rx="2" stroke="currentColor" stroke-width="1.7"/>
              <rect x="3.1" y="15.9" width="3.6" height="3.2" rx=".8" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </span>
          <div>
            <strong>Model Switch</strong>
            <span id="brand-sub">本机 Agent 切换台</span>
          </div>
        </div>
        <nav class="switcher" id="app-switcher"></nav>
        <div class="title-actions">
          <button class="btn" data-view="mcp" id="btn-mcp" type="button">MCP</button>
          <button class="btn primary" id="btn-add" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span id="btn-add-label">添加供应商</span>
          </button>
          <a class="btn icon ghost" id="btn-github" href="https://github.com/zhoushuai2050/model-switch" target="_blank" rel="noreferrer noopener" title="GitHub 仓库" aria-label="GitHub 仓库">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 1C5.922 1 1 5.925 1 12.005c0 4.861 3.15 8.986 7.521 10.374.55.102.75-.238.75-.53 0-.262-.01-1.129-.015-2.048-3.06.664-3.706-1.49-3.706-1.49-.5-1.27-1.221-1.61-1.221-1.61-.998-.68.075-.668.075-.668 1.105.078 1.685 1.134 1.685 1.134.981 1.681 2.575 1.196 3.201.914.1-.71.384-1.196.698-1.471-2.442-.277-5.01-1.22-5.01-5.436 0-1.201.43-2.183 1.134-2.953-.114-.278-.492-1.397.108-2.911 0 0 .921-.294 3.018 1.127A10.5 10.5 0 0 1 12 6.82c.93.004 1.866.126 2.742.37 2.096-1.421 3.015-1.127 3.015-1.127.6 1.514.223 2.633.11 2.91.705.77 1.133 1.752 1.133 2.953 0 4.226-2.572 5.156-5.022 5.428.395.34.747 1.012.747 2.04 0 1.47-.014 2.657-.014 3.018 0 .294.198.637.753.53C19.851 20.99 23 16.86 23 12.005 23 5.925 18.075 1 12 1Z"/>
            </svg>
          </a>
        </div>
      </header>

      <main class="main">
        <div class="toolbar">
          <div class="status-chip" id="status-chip">加载中…</div>
          <div class="toolbar-actions">
            <span id="agent-install-action"></span>
            <button class="btn" id="btn-agent-config" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13Z" stroke="currentColor" stroke-width="1.7"/><path d="M7 8h10M7 12h7M7 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span id="btn-config-label">查看配置</span>
            </button>
            <label class="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <input id="search" type="search" placeholder="搜索供应商 / 模型" autocomplete="off" />
            </label>
          </div>
        </div>
        <div id="agent-install-banner" class="hidden"></div>
        <section class="view" id="view-providers"></section>
        <section class="view hidden" id="view-mcp"></section>
      </main>
    </div>

    <div class="dock" id="dock">
      <div class="picker" id="lang-picker">
        <button class="dock-toggle" id="btn-lang" type="button" aria-expanded="false" aria-controls="lang-menu">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9Z" stroke="currentColor" stroke-width="1.7"/></svg>
          <span id="btn-lang-label">语言</span>
        </button>
        <div class="dock-menu hidden" id="lang-menu">
          <div class="dock-menu-title" id="lang-menu-title">界面语言</div>
          <div class="dock-options" id="lang-options"></div>
        </div>
      </div>
      <div class="picker" id="theme-picker">
        <button class="dock-toggle" id="btn-theme" type="button" aria-expanded="false" aria-controls="theme-menu">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.2a1.8 1.8 0 0 0 1.15-3.16 1.8 1.8 0 0 1 1.15-3.16H17a4 4 0 0 0 4-4C21 6.43 17 3 12 3Z" stroke="currentColor" stroke-width="1.7"/><circle cx="7.5" cy="10" r="1" fill="currentColor"/><circle cx="11" cy="7" r="1" fill="currentColor"/><circle cx="16" cy="7.5" r="1" fill="currentColor"/></svg>
          <span id="btn-theme-label">主题</span>
        </button>
        <div class="dock-menu hidden" id="theme-menu">
          <div class="dock-menu-title" id="theme-menu-title">配色方案</div>
          <div class="dock-options" id="theme-options"></div>
        </div>
      </div>
    </div>
    <div class="modal hidden" id="modal"></div>
    <div class="modal hidden" id="model-modal"></div>
    <div class="toast hidden" id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
